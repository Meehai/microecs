image: python:3.12-bookworm

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

linter:
  before_script:
    - pip install -e ".[dev]"
    - export PYTHONPATH="$PYTHONPATH:."
    - pip install ruff pylint
  script:
    - python -m pylint --rcfile=.pylintrc microecs/
    - ruff check

test_and_run:
  before_script:
    - pip install -e ".[dev]"
    - export PYTHONPATH="$PYTHONPATH:."
  script:
    - python examples/01-hello-world.py --help
    - pytest test

pages:                                # GitLab Pages: themed pdoc site (README home + docs/source/*.md prose + microecs/ API)
  before_script:
    - pip install -e ".[dev]"
    - export PYTHONPATH="$PYTHONPATH:."
  script:
    - bash docs/build_docs.sh public  # must output to public/ for Pages to serve it
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == "master"   # deploy only from master, not merge requests
